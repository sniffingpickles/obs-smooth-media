name: Build Windows Plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  OBS_VERSION: "32.0.4"
  FFMPEG_VERSION: "7.1"
  PLUGIN_NAME: obs-smooth-media
  # Opt JS actions into Node 24 ahead of GitHub's forced cutover.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write   # allow creating a Release on tag builds
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            deps/obs-studio
            deps/obs-source
            deps/ffmpeg
          key: deps-obs${{ env.OBS_VERSION }}-ffmpeg${{ env.FFMPEG_VERSION }}-v4

      - name: Download OBS Studio (portable)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path deps -Force | Out-Null
          $url = "https://github.com/obsproject/obs-studio/releases/download/${{ env.OBS_VERSION }}/OBS-Studio-${{ env.OBS_VERSION }}-Windows-x64.zip"
          Write-Host "Downloading OBS Studio ${{ env.OBS_VERSION }}..."
          Invoke-WebRequest -Uri $url -OutFile deps/obs.zip -UseBasicParsing
          Expand-Archive -Path deps/obs.zip -DestinationPath deps/obs-studio -Force
          Remove-Item deps/obs.zip

          # Flatten if extracted into a subdirectory
          $sub = Get-ChildItem deps/obs-studio -Directory | Select-Object -First 1
          if ($sub -and $sub.Name -ne "bin") {
            Get-ChildItem $sub.FullName | Move-Item -Destination deps/obs-studio -Force
            Remove-Item $sub.FullName -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Download OBS source headers
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host "Cloning OBS source for headers..."
          git clone --depth 1 --branch ${{ env.OBS_VERSION }} --filter=blob:none --sparse `
            https://github.com/obsproject/obs-studio.git deps/obs-source
          Push-Location deps/obs-source
          git sparse-checkout set libobs deps/w32-pthreads
          Pop-Location

      - name: Download FFmpeg dev libraries
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/${{ env.FFMPEG_VERSION }}/ffmpeg-${{ env.FFMPEG_VERSION }}-full_build-shared.zip"
          Write-Host "Downloading FFmpeg ${{ env.FFMPEG_VERSION }}..."
          Invoke-WebRequest -Uri $url -OutFile deps/ffmpeg.zip -UseBasicParsing
          Expand-Archive -Path deps/ffmpeg.zip -DestinationPath deps/ffmpeg -Force
          Remove-Item deps/ffmpeg.zip

          # Flatten if extracted into a subdirectory
          $sub = Get-ChildItem deps/ffmpeg -Directory | Select-Object -First 1
          if ($sub -and $sub.Name -like "ffmpeg-*") {
            Get-ChildItem $sub.FullName | Move-Item -Destination deps/ffmpeg -Force
            Remove-Item $sub.FullName -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Generate OBS build stubs
        shell: pwsh
        run: |
          # obs-config.h includes obsconfig.h which is normally CMake-generated.
          # Create a stub with the defines our plugin needs.
          $stubDir = "deps/obs-source/libobs"
          $stub = @"
          #pragma once
          #define OBS_INSTALL_PREFIX ""
          #define OBS_DATA_PATH "data"
          #define OBS_PLUGIN_DESTINATION "obs-plugins/64bit"
          #define OBS_RELATIVE_PREFIX "../../"
          "@
          Set-Content -Path "$stubDir/obsconfig.h" -Value $stub
          Write-Host "Generated obsconfig.h stub"

      - name: Generate OBS import library
        shell: pwsh
        run: |
          # OBS portable only ships DLLs, not .lib import libraries.
          # Generate obs.lib from obs.dll using MSVC tools.
          $obsDll = Get-ChildItem -Path deps/obs-studio -Recurse -Filter "obs.dll" | Select-Object -First 1
          if (-not $obsDll) {
            Write-Error "obs.dll not found in deps/obs-studio!"
            exit 1
          }
          Write-Host "Found: $($obsDll.FullName)"

          $libDir = "deps/obs-studio/lib"
          New-Item -ItemType Directory -Path $libDir -Force | Out-Null

          # Export symbols and create .def file
          $exports = & dumpbin /exports $obsDll.FullName
          $defContent = "LIBRARY obs`r`nEXPORTS`r`n"
          $inExports = $false
          foreach ($line in $exports) {
            if ($line -match "^\s+ordinal\s+hint\s+RVA\s+name") {
              $inExports = $true
              continue
            }
            if ($inExports -and $line -match "^\s+Summary") {
              break
            }
            if ($inExports -and $line -match "^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)") {
              $defContent += "  $($Matches[1])`r`n"
            }
          }
          $defPath = "$libDir/obs.def"
          Set-Content -Path $defPath -Value $defContent
          Write-Host "Generated $defPath with exports"

          # Generate import lib
          & lib /def:$defPath /out:$libDir/obs.lib /machine:x64
          Write-Host "Generated $libDir/obs.lib"

          # Also generate w32-pthreads.lib
          $ptDll = Get-ChildItem -Path deps/obs-studio -Recurse -Filter "w32-pthreads.dll" | Select-Object -First 1
          if ($ptDll) {
            Write-Host "Found: $($ptDll.FullName)"
            $ptExports = & dumpbin /exports $ptDll.FullName
            $ptDef = "LIBRARY w32-pthreads`r`nEXPORTS`r`n"
            $inPt = $false
            foreach ($line in $ptExports) {
              if ($line -match "^\s+ordinal\s+hint\s+RVA\s+name") { $inPt = $true; continue }
              if ($inPt -and $line -match "^\s+Summary") { break }
              if ($inPt -and $line -match "^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)") {
                $ptDef += "  $($Matches[1])`r`n"
              }
            }
            Set-Content -Path "$libDir/w32-pthreads.def" -Value $ptDef
            & lib /def:$libDir/w32-pthreads.def /out:$libDir/w32-pthreads.lib /machine:x64
            Write-Host "Generated $libDir/w32-pthreads.lib"
          } else {
            Write-Host "WARNING: w32-pthreads.dll not found"
          }

      - name: List dependency structure
        shell: pwsh
        run: |
          Write-Host "=== OBS DLLs ==="
          Get-ChildItem deps/obs-studio -Recurse -Filter "*.dll" | Select-Object FullName
          Write-Host ""
          Write-Host "=== OBS generated libs ==="
          Get-ChildItem deps/obs-studio -Recurse -Filter "*.lib" | Select-Object FullName
          Write-Host ""
          Write-Host "=== OBS headers ==="
          Get-ChildItem deps/obs-source/libobs -Depth 0 | Select-Object FullName
          Write-Host ""
          Write-Host "=== FFmpeg libs ==="
          Get-ChildItem deps/ffmpeg/lib -Filter "*.lib" | Select-Object FullName

      - name: Configure CMake
        shell: pwsh
        run: |
          $obsDir = "${{ github.workspace }}/deps/obs-studio"
          $obsSrc = "${{ github.workspace }}/deps/obs-source"
          $ffmpegDir = "${{ github.workspace }}/deps/ffmpeg"

          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF `
            -DOBS_DIR="$obsDir" `
            -DOBS_INCLUDE_DIR="$obsSrc/libobs" `
            -DOBS_LIB="$obsDir/lib/obs.lib" `
            -DW32_PTHREADS_INCLUDE_DIR="$obsSrc/deps/w32-pthreads" `
            -DW32_PTHREADS_LIB="$obsDir/lib/w32-pthreads.lib" `
            -DFFMPEG_DIR="$ffmpegDir"

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifact/obs-plugins/64bit -Force | Out-Null
          New-Item -ItemType Directory -Path artifact/data/obs-plugins/${{ env.PLUGIN_NAME }} -Force | Out-Null

          # Locate the module independently of single- or multi-config
          # generator output layout.
          $pluginDll = Get-ChildItem build -Recurse `
            -Filter "${{ env.PLUGIN_NAME }}.dll" |
            Select-Object -First 1
          if (-not $pluginDll) {
            throw "${{ env.PLUGIN_NAME }}.dll was not produced"
          }
          Copy-Item $pluginDll.FullName artifact/obs-plugins/64bit/

          # Copy locale data
          if (Test-Path data) {
            Copy-Item -Recurse data/* artifact/data/obs-plugins/${{ env.PLUGIN_NAME }}/
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-windows-x64
          path: artifact/
          retention-days: 90

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "${{ env.PLUGIN_NAME }}-${{ github.ref_name }}-windows-x64.zip"
          Compress-Archive -Path artifact/* -DestinationPath $zip -Force
          gh release create "${{ github.ref_name }}" $zip `
            --title "${{ github.ref_name }}" `
            --generate-notes
