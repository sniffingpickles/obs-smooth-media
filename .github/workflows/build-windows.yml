name: Build Windows Plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  OBS_VERSION: "32.2.2"
  OBS_SHA256: "4d6e40e3ab155f56b30de517380566a206d74b63cdf5ad49aa596924768f97e1"
  OBS_DEPS_VERSION: "2026-07-15"
  OBS_DEPS_SHA256: "6f90e9598fa10cff5ad23cdcfae49b87868c07bf896b02cd464582b4ce2f2ba9"
  PLUGIN_NAME: obs-smooth-media
  # Opt JS actions into Node 24 ahead of GitHub's forced cutover.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write   # allow creating a Release on tag builds
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin version
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(obs-smooth-media VERSION ([0-9]+\.[0-9]+\.[0-9]+)\)') {
            throw "Plugin version was not found in CMakeLists.txt"
          }
          $version = $Matches[1]
          if ("${{ github.ref_type }}" -eq "tag" -and
              "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match plugin version $version"
          }
          "PLUGIN_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            deps/obs-studio
            deps/obs-source
            deps/obs-deps
          key: deps-obs${{ env.OBS_VERSION }}-obsdeps${{ env.OBS_DEPS_VERSION }}-v1

      - name: Download OBS Studio (portable)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path deps -Force | Out-Null
          $url = "https://github.com/obsproject/obs-studio/releases/download/${{ env.OBS_VERSION }}/OBS-Studio-${{ env.OBS_VERSION }}-Windows-x64.zip"
          Write-Host "Downloading OBS Studio ${{ env.OBS_VERSION }}..."
          Invoke-WebRequest -Uri $url -OutFile deps/obs.zip -UseBasicParsing
          $actualHash = (Get-FileHash deps/obs.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne "${{ env.OBS_SHA256 }}") {
            throw "OBS archive SHA-256 mismatch: $actualHash"
          }
          Expand-Archive -Path deps/obs.zip -DestinationPath deps/obs-studio -Force
          Remove-Item deps/obs.zip

          # Flatten if extracted into a subdirectory
          $sub = Get-ChildItem deps/obs-studio -Directory | Select-Object -First 1
          if ($sub -and $sub.Name -ne "bin") {
            Get-ChildItem $sub.FullName | Move-Item -Destination deps/obs-studio -Force
            Remove-Item $sub.FullName -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Download OBS source headers
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host "Cloning OBS source for headers..."
          git clone --depth 1 --branch ${{ env.OBS_VERSION }} --filter=blob:none --sparse `
            https://github.com/obsproject/obs-studio.git deps/obs-source
          Push-Location deps/obs-source
          git sparse-checkout set libobs deps/w32-pthreads
          Pop-Location

      - name: Download OBS build dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = "${{ env.OBS_DEPS_VERSION }}"
          $url = "https://github.com/obsproject/obs-deps/releases/download/$version/windows-deps-$version-x64.zip"
          Write-Host "Downloading OBS build dependencies $version..."
          Invoke-WebRequest -Uri $url -OutFile deps/obs-deps.zip -UseBasicParsing
          $actualHash = (Get-FileHash deps/obs-deps.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne "${{ env.OBS_DEPS_SHA256 }}") {
            throw "OBS dependency archive SHA-256 mismatch: $actualHash"
          }
          Expand-Archive -Path deps/obs-deps.zip -DestinationPath deps/obs-deps -Force
          Remove-Item deps/obs-deps.zip

      - name: Generate OBS import libraries
        shell: pwsh
        run: ./scripts/generate-windows-import-libs.ps1 -ObsDirectory deps/obs-studio

      - name: List dependency structure
        shell: pwsh
        run: |
          Write-Host "=== OBS DLLs ==="
          Get-ChildItem deps/obs-studio -Recurse -Filter "*.dll" | Select-Object FullName
          Write-Host ""
          Write-Host "=== OBS generated libs ==="
          Get-ChildItem deps/obs-studio -Recurse -Filter "*.lib" | Select-Object FullName
          Write-Host ""
          Write-Host "=== OBS headers ==="
          Get-ChildItem deps/obs-source/libobs -Depth 0 | Select-Object FullName
          Write-Host ""
          Write-Host "=== OBS dependency libraries ==="
          Get-ChildItem deps/obs-deps/lib -Filter "*.lib" | Select-Object FullName

      - name: Configure CMake
        shell: pwsh
        run: |
          $obsDir = "${{ github.workspace }}/deps/obs-studio"
          $obsSrc = "${{ github.workspace }}/deps/obs-source"
          $obsDepsDir = "${{ github.workspace }}/deps/obs-deps"

          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF `
            -DOBS_DIR="$obsDir" `
            -DOBS_INCLUDE_DIR="$obsSrc/libobs" `
            -DOBS_LIB="$obsDir/lib/obs.lib" `
            -DW32_PTHREADS_INCLUDE_DIR="$obsSrc/deps/w32-pthreads" `
            -DW32_PTHREADS_LIB="$obsDir/lib/w32-pthreads.lib" `
            -DFFMPEG_DIR="$obsDepsDir"

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifact/obs-plugins/64bit -Force | Out-Null
          New-Item -ItemType Directory -Path artifact/data/obs-plugins/${{ env.PLUGIN_NAME }} -Force | Out-Null

          # Locate the module independently of single- or multi-config
          # generator output layout.
          $pluginDll = Get-ChildItem build -Recurse `
            -Filter "${{ env.PLUGIN_NAME }}.dll" |
            Select-Object -First 1
          if (-not $pluginDll) {
            throw "${{ env.PLUGIN_NAME }}.dll was not produced"
          }
          Copy-Item $pluginDll.FullName artifact/obs-plugins/64bit/

          # Copy locale data
          if (Test-Path data) {
            Copy-Item -Recurse data/* artifact/data/obs-plugins/${{ env.PLUGIN_NAME }}/
          }

      - name: Build and test installer
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "installer/windows/update.ps1"),
            [ref]$tokens,
            [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) {
            throw ($parseErrors | Out-String)
          }

          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty Source
          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } |
              Select-Object -First 1
          }
          if (-not $iscc) {
            throw "Inno Setup compiler was not found"
          }

          & $iscc "/DAppVersion=$env:PLUGIN_VERSION" `
            "installer/windows/obs-smooth-media.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          $setup = Resolve-Path `
            "installer-output/${{ env.PLUGIN_NAME }}-windows-x64-setup.exe"
          $obsDir = (Resolve-Path "deps/obs-studio").Path
          $arguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/DIR=$obsDir"
          )
          $install = Start-Process -FilePath $setup -ArgumentList $arguments `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installer smoke test failed with exit code $($install.ExitCode)"
          }

          $builtDll = "artifact/obs-plugins/64bit/${{ env.PLUGIN_NAME }}.dll"
          $installedDll = Join-Path $obsDir `
            "obs-plugins/64bit/${{ env.PLUGIN_NAME }}.dll"
          if (-not (Test-Path -LiteralPath $installedDll)) {
            throw "Installer did not place the plugin DLL"
          }
          if ((Get-FileHash $builtDll).Hash -ne
              (Get-FileHash $installedDll).Hash) {
            throw "Installed DLL does not match the release DLL"
          }
          $updater = Join-Path $obsDir `
            "data/obs-plugins/${{ env.PLUGIN_NAME }}/update.ps1"
          if (-not (Test-Path -LiteralPath $updater)) {
            throw "Installer did not place the updater"
          }
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File $updater -CheckOnly
          if ($LASTEXITCODE -ne 0) {
            throw "Updater smoke test failed with exit code $LASTEXITCODE"
          }

          $uninstaller = Get-ChildItem -LiteralPath $obsDir `
            -Filter "unins*.exe" | Select-Object -First 1
          if (-not $uninstaller) {
            throw "Installer did not create an uninstaller"
          }
          $uninstall = Start-Process -FilePath $uninstaller.FullName `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
            -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstaller smoke test failed with exit code $($uninstall.ExitCode)"
          }
          if (Test-Path -LiteralPath $installedDll) {
            throw "Uninstaller left the plugin DLL behind"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $obsDir "bin/64bit/obs64.exe"))) {
            throw "Uninstaller damaged the OBS installation"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-windows-x64
          path: |
            artifact/
            installer-output/*.exe
          retention-days: 90

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "${{ env.PLUGIN_NAME }}-${{ github.ref_name }}-windows-x64.zip"
          Compress-Archive -Path artifact/* -DestinationPath $zip -Force
          $installer = "installer-output/${{ env.PLUGIN_NAME }}-windows-x64-setup.exe"
          gh release create "${{ github.ref_name }}" $zip $installer `
            --title "${{ github.ref_name }}" `
            --generate-notes
