name: Build Windows Plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  OBS_VERSION: "32.2.2"
  OBS_SHA256: "4d6e40e3ab155f56b30de517380566a206d74b63cdf5ad49aa596924768f97e1"
  OBS_DEPS_VERSION: "2026-07-15"
  OBS_DEPS_SHA256: "6f90e9598fa10cff5ad23cdcfae49b87868c07bf896b02cd464582b4ce2f2ba9"
  PLUGIN_NAME: obs-smooth-media
  # Opt JS actions into Node 24 ahead of GitHub's forced cutover.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write   # allow creating a Release on tag builds
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            deps/obs-studio
            deps/obs-source
            deps/obs-deps
          key: deps-obs${{ env.OBS_VERSION }}-obsdeps${{ env.OBS_DEPS_VERSION }}-v1

      - name: Download OBS Studio (portable)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path deps -Force | Out-Null
          $url = "https://github.com/obsproject/obs-studio/releases/download/${{ env.OBS_VERSION }}/OBS-Studio-${{ env.OBS_VERSION }}-Windows-x64.zip"
          Write-Host "Downloading OBS Studio ${{ env.OBS_VERSION }}..."
          Invoke-WebRequest -Uri $url -OutFile deps/obs.zip -UseBasicParsing
          $actualHash = (Get-FileHash deps/obs.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne "${{ env.OBS_SHA256 }}") {
            throw "OBS archive SHA-256 mismatch: $actualHash"
          }
          Expand-Archive -Path deps/obs.zip -DestinationPath deps/obs-studio -Force
          Remove-Item deps/obs.zip

          # Flatten if extracted into a subdirectory
          $sub = Get-ChildItem deps/obs-studio -Directory | Select-Object -First 1
          if ($sub -and $sub.Name -ne "bin") {
            Get-ChildItem $sub.FullName | Move-Item -Destination deps/obs-studio -Force
            Remove-Item $sub.FullName -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Download OBS source headers
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host "Cloning OBS source for headers..."
          git clone --depth 1 --branch ${{ env.OBS_VERSION }} --filter=blob:none --sparse `
            https://github.com/obsproject/obs-studio.git deps/obs-source
          Push-Location deps/obs-source
          git sparse-checkout set libobs deps/w32-pthreads
          Pop-Location

      - name: Download OBS build dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = "${{ env.OBS_DEPS_VERSION }}"
          $url = "https://github.com/obsproject/obs-deps/releases/download/$version/windows-deps-$version-x64.zip"
          Write-Host "Downloading OBS build dependencies $version..."
          Invoke-WebRequest -Uri $url -OutFile deps/obs-deps.zip -UseBasicParsing
          $actualHash = (Get-FileHash deps/obs-deps.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne "${{ env.OBS_DEPS_SHA256 }}") {
            throw "OBS dependency archive SHA-256 mismatch: $actualHash"
          }
          Expand-Archive -Path deps/obs-deps.zip -DestinationPath deps/obs-deps -Force
          Remove-Item deps/obs-deps.zip

      - name: Generate OBS import libraries
        shell: pwsh
        run: ./scripts/generate-windows-import-libs.ps1 -ObsDirectory deps/obs-studio

      - name: List dependency structure
        shell: pwsh
        run: |
          Write-Host "=== OBS DLLs ==="
          Get-ChildItem deps/obs-studio -Recurse -Filter "*.dll" | Select-Object FullName
          Write-Host ""
          Write-Host "=== OBS generated libs ==="
          Get-ChildItem deps/obs-studio -Recurse -Filter "*.lib" | Select-Object FullName
          Write-Host ""
          Write-Host "=== OBS headers ==="
          Get-ChildItem deps/obs-source/libobs -Depth 0 | Select-Object FullName
          Write-Host ""
          Write-Host "=== OBS dependency libraries ==="
          Get-ChildItem deps/obs-deps/lib -Filter "*.lib" | Select-Object FullName

      - name: Configure CMake
        shell: pwsh
        run: |
          $obsDir = "${{ github.workspace }}/deps/obs-studio"
          $obsSrc = "${{ github.workspace }}/deps/obs-source"
          $obsDepsDir = "${{ github.workspace }}/deps/obs-deps"

          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF `
            -DOBS_DIR="$obsDir" `
            -DOBS_INCLUDE_DIR="$obsSrc/libobs" `
            -DOBS_LIB="$obsDir/lib/obs.lib" `
            -DW32_PTHREADS_INCLUDE_DIR="$obsSrc/deps/w32-pthreads" `
            -DW32_PTHREADS_LIB="$obsDir/lib/w32-pthreads.lib" `
            -DFFMPEG_DIR="$obsDepsDir"

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifact/obs-plugins/64bit -Force | Out-Null
          New-Item -ItemType Directory -Path artifact/data/obs-plugins/${{ env.PLUGIN_NAME }} -Force | Out-Null

          # Locate the module independently of single- or multi-config
          # generator output layout.
          $pluginDll = Get-ChildItem build -Recurse `
            -Filter "${{ env.PLUGIN_NAME }}.dll" |
            Select-Object -First 1
          if (-not $pluginDll) {
            throw "${{ env.PLUGIN_NAME }}.dll was not produced"
          }
          Copy-Item $pluginDll.FullName artifact/obs-plugins/64bit/

          # Copy locale data
          if (Test-Path data) {
            Copy-Item -Recurse data/* artifact/data/obs-plugins/${{ env.PLUGIN_NAME }}/
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-windows-x64
          path: artifact/
          retention-days: 90

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "${{ env.PLUGIN_NAME }}-${{ github.ref_name }}-windows-x64.zip"
          Compress-Archive -Path artifact/* -DestinationPath $zip -Force
          gh release create "${{ github.ref_name }}" $zip `
            --title "${{ github.ref_name }}" `
            --generate-notes
