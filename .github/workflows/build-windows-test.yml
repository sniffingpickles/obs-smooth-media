name: Build Windows Plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  OBS_VERSION: "32.2.1"
  FFMPEG_VERSION: "8.0" # Upgraded to match OBS 32.2.x core structural alignment
  PLUGIN_NAME: obs-smooth-media
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write   # Allow creating a Release on tag builds
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC Toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Official SDK Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            deps/obs-sdk
            deps/ffmpeg
          # Incremented to -v5 to fully flush out corrupted stubs or layout data
          key: deps-obs${{ env.OBS_VERSION }}-ffmpeg${{ env.FFMPEG_VERSION }}-v5

      - name: Download Official OBS Studio SDK
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path deps -Force | Out-Null
          
          # Native environment string formatting to ensure zero parsing conflicts
          $version = "$env:OBS_VERSION"
          $url = "https://github.com"
          $zipPath = "deps/sdk.zip"
          $destPath = "$pwd/deps/obs-sdk"
          
          Write-Host "Downloading Official OBS Studio SDK version $version..."
          Invoke-WebRequest -Uri $url -OutFile $zipPath -UseBasicParsing
          
          # Use standard .NET extraction assembly directly to completely bypass the Windows MAX_PATH length limit
          Write-Host "Extracting archive to absolute destination: $destPath"
          [System.IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path $zipPath).Path, $destPath, $true)
          
          Remove-Item $zipPath -Force



      - name: Download Aligned FFmpeg Developer Assets
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com{{ env.FFMPEG_VERSION }}/ffmpeg-${{ env.FFMPEG_VERSION }}-full_build-shared.zip"
          Write-Host "Downloading matching FFmpeg ${{ env.FFMPEG_VERSION }} dev files..."
          Invoke-WebRequest -Uri $url -OutFile deps/ffmpeg.zip -UseBasicParsing
          Expand-Archive -Path deps/ffmpeg.zip -DestinationPath deps/ffmpeg -Force
          Remove-Item deps/ffmpeg.zip

          # Flatten directory layout if nested
          $sub = Get-ChildItem deps/ffmpeg -Directory | Select-Object -First 1
          if ($sub -and $sub.Name -like "ffmpeg-*") {
            Get-ChildItem $sub.FullName | Move-Item -Destination deps/ffmpeg -Force
            Remove-Item $sub.FullName -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Configure Clean CMake Build Environments
        shell: pwsh
        run: |
          $sdkDir = "${{ github.workspace }}/deps/obs-sdk"
          $ffmpegDir = "${{ github.workspace }}/deps/ffmpeg"

          # Native CMake mapping targeting the formal configuration modules
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF `
            -Dobs-studio_DIR="$sdkDir/cmake/obs-studio" `
            -DFFMPEG_DIR="$ffmpegDir"

      - name: Build Project Binary
        run: cmake --build build --config Release

      - name: Prepare Plugin Architecture Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifact/obs-plugins/64bit -Force | Out-Null
          New-Item -ItemType Directory -Path artifact/data/obs-plugins/${{ env.PLUGIN_NAME }} -Force | Out-Null

          # Locate target DLL module outputs independently of layout
          $pluginDll = Get-ChildItem build -Recurse -Filter "${{ env.PLUGIN_NAME }}.dll" | Select-Object -First 1
          if (-not $pluginDll) {
            throw "${{ env.PLUGIN_NAME }}.dll was not produced by compiler paths"
          }
          Copy-Item $pluginDll.FullName artifact/obs-plugins/64bit/

          # Bundle locale files safely into artifact tree
          if (Test-Path data) {
            Copy-Item -Recurse data/* artifact/data/obs-plugins/${{ env.PLUGIN_NAME }}/
          }

      - name: Upload Workspace Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-windows-x64
          path: artifact/
          retention-days: 90

      - name: Publish Production Release (On Tag Event)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "${{ env.PLUGIN_NAME }}-${{ github.ref_name }}-windows-x64.zip"
          Compress-Archive -Path artifact/* -DestinationPath $zip -Force
          gh release create "${{ github.ref_name }}" $zip `
            --title "${{ github.ref_name }}" `
            --generate-notes
